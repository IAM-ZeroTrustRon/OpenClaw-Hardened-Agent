# /etc/wsl.conf
#
# Goes inside the WSL2 distro named "openclaw".
# This is the isolation boundary for the agent.
#
# Applies at distro boot only. After editing, run this on Windows:
#     wsl --terminate openclaw
#     wsl -d openclaw
#
# Then verify inside the distro:
#     ls /mnt/c     -> expect nothing
#     whoami        -> expect claw

[boot]
# systemd is required for the gateway to run as a systemd user service.
systemd=true

[automount]
# Do NOT mount Windows drives. There is no /mnt/c.
# The agent cannot read the Windows filesystem even with a full shell.
enabled=false

[interop]
# Do not let Linux launch Windows executables.
enabled=false
# Do not add Windows directories to PATH.
# Without this line, interop=false is only half the control.
appendWindowsPath=false

[user]
# Dedicated non-personal user. Shells open as claw, not root.
default=claw
